name: Check installers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq curl unzip zip xz-utils zstd bsdutils
      - name: Syntax, lint and offline regression tests
        run: bash tests/check.sh
